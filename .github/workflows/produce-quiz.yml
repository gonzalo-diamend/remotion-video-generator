name: Produce Quiz

on:
  schedule:
    # Four UTC checks preserve 13:00 and 21:00 in Europe/Madrid across DST.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      stock_index:
        description: 'Quiz del catálogo local (1-180)'
        required: true
        default: '1'
        type: string
      tts:
        description: 'Proveedor de voz'
        required: true
        default: 'mpt'
        type: choice
        options: ['mpt', 'none']
      upload:
        description: 'Subir a YouTube'
        required: true
        default: false
        type: boolean
      privacy:
        description: 'Privacidad para ejecución manual'
        required: true
        default: 'private'
        type: choice
        options: ['private', 'unlisted', 'public']

permissions:
  contents: read

concurrency:
  group: youtube-quiz-production
  cancel-in-progress: false

jobs:
  produce:
    if: github.event_name != 'schedule' || vars.YT_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stock item and publication plan
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          YT_STOCK_START_DATE: ${{ vars.YT_STOCK_START_DATE || '2026-09-11' }}
          MANUAL_STOCK_INDEX: ${{ inputs.stock_index }}
          MANUAL_TTS: ${{ inputs.tts }}
          MANUAL_UPLOAD: ${{ inputs.upload }}
          MANUAL_PRIVACY: ${{ inputs.privacy }}
        run: node scripts/select-topic.js

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.should_run == 'true'
        with:
          node-version: '20'

      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.should_run == 'true' && steps.plan.outputs.tts == 'mpt'

      - name: Install Node dependencies
        if: steps.plan.outputs.should_run == 'true'
        run: npm install --no-audit --no-fund

      - name: Install free Edge TTS provider
        if: steps.plan.outputs.should_run == 'true' && steps.plan.outputs.tts == 'mpt'
        run: npm run setup:mpt

      - name: Produce and publish quiz
        if: steps.plan.outputs.should_run == 'true'
        env:
          QUIZ_STOCK_INDEX: ${{ steps.plan.outputs.stock_index }}
          QUIZ_TTS: ${{ steps.plan.outputs.tts }}
          QUIZ_UPLOAD: ${{ steps.plan.outputs.upload }}
          QUIZ_PRIVACY: ${{ steps.plan.outputs.privacy }}
          MPT_VOICE: ${{ vars.MPT_VOICE || 'es-ES-AlvaroNeural' }}
          MPT_VOICE_RATE: ${{ vars.MPT_VOICE_RATE || '+15%' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REDIRECT_URI: ${{ secrets.YT_REDIRECT_URI }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_DEFAULT_CATEGORY_ID: ${{ vars.YT_DEFAULT_CATEGORY_ID || '27' }}
          YT_DEFAULT_PLAYLIST_ID: ${{ vars.YT_DEFAULT_PLAYLIST_ID }}
        run: |
          args=("--index=$QUIZ_STOCK_INDEX" "--tts=$QUIZ_TTS" "--privacy=$QUIZ_PRIVACY")
          if [ "$QUIZ_UPLOAD" = "true" ]; then args+=("--upload"); fi
          node scripts/create-video.js "${args[@]}"

      - name: Upload generated assets
        if: github.event_name == 'workflow_dispatch' && steps.plan.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: quiz-${{ github.run_number }}
          path: |
            out/videos/*.mp4
            out/thumbnails/*.png
            out/jobs/**/manifest.json
            out/jobs/**/quiz.json
          retention-days: 1
